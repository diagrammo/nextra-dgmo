name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # knip/jscpd/depcheck analyze source + package.json only — no dist
      # needed, so the trio runs right after install.
      - name: Hygiene checks (formatting, dead code, duplication, deps)
        run: pnpm check:all

      # Build first so the exports map (config/client) resolves through
      # dist/ before typecheck/tests run.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Turbopack cannot serialize the function-valued remark plugin `withDgmo`
      # injects, so the fixture builds with `--webpack` — the same constraint
      # real consumers have, and the reason the README leads with it.
      - name: Fixture build (Next static export)
        run: pnpm test:e2e
