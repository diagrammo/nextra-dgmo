name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /nextra-dgmo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build wrapper
        run: pnpm build

      - name: Install fixture deps
        run: cd tests/fixture && pnpm install --no-frozen-lockfile

      - name: Compose showcase page (live links + all chart types from dgmo-content)
        run: node scripts/compose-showcase.mjs tests/fixture/content/docs/diagrams.mdx

      - name: Build site
        run: cd tests/fixture && pnpm exec next build --webpack

      - name: Root redirect to showcase
        run: printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./docs/diagrams.html">' > tests/fixture/out/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: tests/fixture/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
